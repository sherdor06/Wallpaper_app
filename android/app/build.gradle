plugins {
    id("com.android.application")
    id("kotlin-android")
    id("dev.flutter.flutter-gradle-plugin")
    // Firebase: reads google-services.json + uploads R8 mapping.txt for
    // Crashlytics de-obfuscation. Must come after the Android/Flutter plugins.
    id("com.google.gms.google-services")
    id("com.google.firebase.crashlytics")
}

// Release imzolash kalitlari (android/key.properties — repo'ga kirmaydi).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { keystoreProperties.load(it) }
}

android {
    namespace = "com.sherdor.wallpapers"
    compileSdk = flutter.compileSdkVersion
    // O'rnatilgan sog'lom NDK (buzilgan 27.0.12077973 o'rniga). Re-download shart emas.
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = JavaVersion.VERSION_11.toString() }

    defaultConfig {
        applicationId = "com.sherdor.wallpapers"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // key.properties bo'lsa release kalit, bo'lmasa debug (CI/boshqa mashina).
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.getByName("release")
                : signingConfigs.getByName("debug")
            // R8: kodni qisqartirish + obfuskatsiya, resurslarni tozalash (AAB hajmi kichrayadi).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // Mediated networks for AppLovin MAX. Each adapter bundles the network's own
    // SDK; MAX loads whichever ones the dashboard has enabled, so adding an
    // adapter here without switching the network on in the dashboard does
    // nothing but add weight.
    //
    // Yandex first because it carries this app's CIS audience — MAX's own
    // demand is thin there, and that region is where most installs land.
    implementation "com.applovin.mediation:yandex-adapter:7.18.5.0"
}

flutter { source = "../.." }
