plugins {
    id("com.android.application")
    id("kotlin-android")
    id("dev.flutter.flutter-gradle-plugin")
    // Firebase: reads google-services.json + uploads R8 mapping.txt for
    // Crashlytics de-obfuscation. Must come after the Android/Flutter plugins.
    id("com.google.gms.google-services")
    id("com.google.firebase.crashlytics")
}

// Release imzolash kalitlari (android/key.properties — repo'ga kirmaydi).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { keystoreProperties.load(it) }
}

android {
    namespace = "com.sherdor.wallpapers"
    compileSdk = flutter.compileSdkVersion
    // O'rnatilgan sog'lom NDK (buzilgan 27.0.12077973 o'rniga). Re-download shart emas.
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = JavaVersion.VERSION_11.toString() }

    defaultConfig {
        applicationId = "com.sherdor.wallpapers"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // key.properties bo'lsa release kalit, bo'lmasa debug (CI/boshqa mashina).
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.getByName("release")
                : signingConfigs.getByName("debug")
            // R8: kodni qisqartirish + obfuskatsiya, resurslarni tozalash (AAB hajmi kichrayadi).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    // Store APKs are ARM-only (`--target-platform android-arm,android-arm64`),
    // which drops Flutter's own x86 libraries but not the plugins'. A half-filled
    // lib/x86_64 makes an x86_64 device pick that ABI and crash without
    // libflutter.so, so the x86 folders go whenever Flutter's do.
    def targetPlatforms = project.findProperty("target-platform")?.toString()
    if (targetPlatforms != null && !targetPlatforms.contains("android-x64")) {
        packaging {
            jniLibs {
                excludes.add("lib/x86_64/**")
                excludes.add("lib/x86/**")
            }
        }
    }
}

// No ad-network dependency here: the yandex_mobileads plugin brings the SDK.

flutter { source = "../.." }
