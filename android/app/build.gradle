plugins {
    id("com.android.application")
    id("kotlin-android")
    id("dev.flutter.flutter-gradle-plugin")
    // Firebase: reads google-services.json + uploads R8 mapping.txt for
    // Crashlytics de-obfuscation. Must come after the Android/Flutter plugins.
    id("com.google.gms.google-services")
    id("com.google.firebase.crashlytics")
}

// Release imzolash kalitlari (android/key.properties — repo'ga kirmaydi).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { keystoreProperties.load(it) }
}

android {
    namespace = "com.sherdor.wallpapers"
    compileSdk = flutter.compileSdkVersion
    // O'rnatilgan sog'lom NDK (buzilgan 27.0.12077973 o'rniga). Re-download shart emas.
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = JavaVersion.VERSION_11.toString() }

    defaultConfig {
        applicationId = "com.sherdor.wallpapers"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // key.properties bo'lsa release kalit, bo'lmasa debug (CI/boshqa mashina).
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.getByName("release")
                : signingConfigs.getByName("debug")
            // R8: kodni qisqartirish + obfuskatsiya, resurslarni tozalash (AAB hajmi kichrayadi).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

// No ad-network dependency here. Yandex Mobile Ads arrives through the
// yandex_mobileads plugin, whose own build.gradle declares
// `com.yandex.android:mobileads:8.4.0`.
//
// The AppMetrica clash that used to constrain this file is gone with the
// AppLovin adapter: appmetrica_plugin and the ad SDK both pull
// AppMetricaLibraryAdapter, but Gradle resolves overlapping *ranges* to the
// highest match on its own. Only CocoaPods ever needed the exact pin -- see
// the note in pubspec.yaml.

flutter { source = "../.." }
